name: Build

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install
              run: |
                  corepack enable
                  yarn install --immutable

            - name: Lint
              run: yarn lint

            - name: Build
              run: yarn build
